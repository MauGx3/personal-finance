name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install Django requirements for proper test environment
          pip install -r requirements/base.txt
          # Ensure testing dependencies are available in CI for test collection
          pip install pytest-django celery django-celery-beat coverage

      - name: Lint (flake8)
        run: |
          flake8 src tests --max-line-length=88 --select=E9,F63,F7,F82

      - name: Run tests
        env:
          PYTHONPATH: src
          DATABASE_URL: sqlite:///test.db
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DJANGO_DEBUG: False
        run: |
          pytest -q || [ $? -eq 5 ]

  security-audit:
    permissions:
      contents: read
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-audit

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pip-audit
        run: |
          pip-audit --progress-spinner off

