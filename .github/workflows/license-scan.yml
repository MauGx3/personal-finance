name: License scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pip-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          if test -f requirements.txt; then pip install -r requirements.txt; fi
      - name: Export licenses CSV
        run: |
          pip-licenses --format=csv --output-file=license-report.csv
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.csv
      - name: Fail on disallowed licenses
        env:
          DISALLOWED_LICENSES: ${{ secrets.DISALLOWED_LICENSES }}
        run: |
          if [ -n "${DISALLOWED_LICENSES}" ]; then
            printf '%s\n' \
              "import csv, os, sys" \
              "disallowed = os.environ.get('DISALLOWED_LICENSES','').split(',')" \
              "if not disallowed or disallowed == ['']:", \
              "    sys.exit(0)" \
              "found = []" \
              "with open('license-report.csv', newline='') as f:" \
              "    reader = csv.DictReader(f)" \
              "    for r in reader:" \
              "        lic = r.get('License') or r.get('LicenseName') or ''" \
              "        if any(d.strip().lower() == lic.strip().lower() for d in disallowed):" \
              "            found.append((r.get('Name'), lic))" \
              "if found:" \
              "    print('Found disallowed licenses:', found)" \
              "    sys.exit(2)" \
              "else:" \
              "    print('No disallowed licenses found')" > license_check.py
            python license_check.py
          else
            echo 'DISALLOWED_LICENSES not set, skipping license failure check'
          fi
