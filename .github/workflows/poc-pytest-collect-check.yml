name: PoC - pytest collect check
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  collect-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run pytest collection and fail if zero tests
        env:
          PYTHONPATH: src
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          # Count collected tests (pytest prints each collected item on --collect-only -q)
          COUNT=$(pytest --collect-only -q | wc -l)
          echo "Collected tests: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No tests were collected. Please add tests or request an exemption."
            exit 1
          fi
