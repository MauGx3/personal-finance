name: Regenerate requirements.lock

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regen-lock:
    name: Regenerate requirements.lock (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Create venv and upgrade pip
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (with constraints)
        run: |
          # Install pinned / constrained requirements for deterministic build
          if [ -f requirements.txt ]; then
            .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          fi
          if [ -f requirements/base.txt ]; then
            .venv/bin/python -m pip install -r requirements/base.txt -c constraints.txt
          fi
          if [ -f requirements-dev.txt ]; then
            .venv/bin/python -m pip install -r requirements-dev.txt -c constraints.txt
          fi

      - name: Generate requirements.lock
        run: |
          # Freeze the resolved environment to requirements.lock
          .venv/bin/python -m pip freeze | sort > requirements.lock
          git status --porcelain

      - name: Commit and push lockfile if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code requirements.lock; then
            echo "No changes to requirements.lock"
            exit 0
          fi
          git add requirements.lock
          git commit -m "feat(deps): regenerate requirements.lock using Python 3.10"
          git push
