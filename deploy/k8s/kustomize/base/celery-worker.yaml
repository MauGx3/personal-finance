apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-finance-celery-worker
  labels:
    app: personal-finance
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-finance
      component: celery-worker
  template:
    metadata:
      labels:
        app: personal-finance
        component: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: personal-finance:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              uv run celery -A config worker -l info
          envFrom:
            - configMapRef:
                name: personal-finance-config
            - secretRef:
                name: personal-finance-secrets
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-finance-celery-beat
  labels:
    app: personal-finance
    component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-finance
      component: celery-beat
  template:
    metadata:
      labels:
        app: personal-finance
        component: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: personal-finance:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              uv run celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - configMapRef:
                name: personal-finance-config
            - secretRef:
                name: personal-finance-secrets
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
