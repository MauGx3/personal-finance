apiVersion: v1
kind: ConfigMap
metadata:
  name: personal-finance-config
data:
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "config.settings.prod"
  DJANGO_ALLOWED_HOSTS: "personal-finance.example.com,personal-finance-web,*"
  DATABASE_URL: "postgresql://personal-finance_user:changeme@personal-finance-pg-rw:5432/personal-finance_db"
  REDIS_URL: "redis://personal-finance-redis-master:6379/0"
  CELERY_BROKER_URL: "redis://personal-finance-redis-master:6379/1"
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.example.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  UV_NO_CACHE: "1"
