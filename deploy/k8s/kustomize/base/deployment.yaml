apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-finance-web
  labels:
    app: personal-finance
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-finance
      component: web
  template:
    metadata:
      labels:
        app: personal-finance
        component: web
    spec:
      initContainers:
        - name: migrate
          image: personal-finance:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              uv run python manage.py migrate --noinput &&
              uv run python manage.py collectstatic --noinput
              envFrom:
            - configMapRef:
                name: personal-finance-config
            - secretRef:
                name: personal-finance-secrets
          volumeMounts:
            - name: static-files
              mountPath: /app/staticfiles
      containers:
        - name: web
          image: personal-finance:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: personal-finance-config
            - secretRef:
                name: personal-finance-secrets
          volumeMounts:
            - name: static-files
              mountPath: /app/staticfiles
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: static-files
          emptyDir: {}
