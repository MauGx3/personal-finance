apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-finance-redis
  labels:
    app: personal-finance
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-finance
      component: redis
  template:
    metadata:
      labels:
        app: personal-finance
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: personal-finance-redis-master
  labels:
    app: personal-finance
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: personal-finance
    component: redis
