apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

# Production-specific configurations
replicas:
  - name: personal-finance-web
    count: 3
  - name: personal-finance-celery-worker
    count: 2

# Production-specific patches
patches:
  - target:
      kind: Deployment
      name: personal-finance-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: ConfigMap
      name: personal-finance-config
    patch: |-
      - op: replace
        path: /data/DEBUG
        value: "False"
