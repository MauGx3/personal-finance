apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: personal_finance-pg
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  storage:
    size: 10Gi
    storageClass: standard

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      database: personal_finance_db
      owner: personal_finance_user
      secret:
        name: personal_finance-pg-credentials

  backup:
    barmanObjectStore:
      destinationPath: s3://your-bucket/personal_finance/
      s3Credentials:
        accessKeyId:
          name: personal_finance-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: personal_finance-s3-credentials
          key: SECRET_ACCESS_KEY
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true
