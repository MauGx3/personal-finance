# Two small containers and one volume. Works as a Portainer stack on a NAS.
services:
  web:
    build: .
    image: personal-finance:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    volumes:
      - data:/data

  # Fetches prices on a schedule. No broker or queue needed for one user.
  prices:
    image: personal-finance:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file: .env
    volumes:
      - data:/data
    command: >
      sh -c "while true; do python manage.py sync_prices; sleep ${PRICE_SYNC_INTERVAL_SECONDS:-21600}; done"

volumes:
  data:
