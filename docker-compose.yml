services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "finance"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Bind to an alternate host port to reduce accidental exposure
    ports:
      # bind to localhost only to avoid exposing Postgres to external probes
      - "127.0.0.1:52135:5432"

  app:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      # Use the internal DB port; host mapping happens above
      DATABASE_URL: postgresql+psycopg2://finance:finance@db:5432/finance
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
      RUN_MIGRATIONS_ON_START: "1"
      USE_DOCKER: "no"
      DJANGO_SETTINGS_MODULE: "config.settings.production"
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - .:/app

volumes:
  pg_data:
