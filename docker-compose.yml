version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do not publish Postgres port to the Docker host in production stacks deployed by Portainer.
    # Keeping the DB internal to the Docker network prevents external probes from hitting 5432
    # and avoids "incomplete startup packet" log noise. If you need host access, expose the
    # port via a secure method externally.

  app:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - stack.env
    environment:
      PORT: ${PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://finance:finance@db:5432/finance}
      RUN_MIGRATIONS_ON_START: "${RUN_MIGRATIONS_ON_START:-1}"
      USE_DOCKER: "${USE_DOCKER:-yes}"
      DJANGO_SETTINGS_MODULE: "${DJANGO_SETTINGS_MODULE:-config.settings.production}"
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - .:/app:rw

volumes:
  pg_data:
