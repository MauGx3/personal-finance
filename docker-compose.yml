services:
  web:
    build: .
    command: uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-docker-dev-key

      - DATABASE_URL=postgresql://personal_finance_user:personal_finance_password@db:5432/personal_finance_db


      - REDIS_URL=redis://redis:6379/0

      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025

      - UV_NO_CACHE=1

    env_file:
      - .env

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personal_finance_db
      POSTGRES_USER: personal_finance_user
      POSTGRES_PASSWORD: personal_finance_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_finance_user -d personal_finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"



  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"


volumes:
  postgres_data:

  redis_data:
