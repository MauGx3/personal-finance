version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    # Use a repo-relative bind mount so Portainer (non-Swarm) can deploy this stack
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
