{% extends "base.html" %}
{% block content %}
<h1>Delete transaction</h1>
<form method="post" class="card stack">{% csrf_token %}
  <p>Delete <strong>{{ object }}</strong>? The holding is recalculated from the remaining transactions.</p>
  <div class="actions"><button class="danger">Delete</button><a href="{% url 'portfolios:transactions' %}">Cancel</a></div>
</form>
{% endblock %}
